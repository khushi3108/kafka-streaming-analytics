# ---------------------------------------------------------------------
# Secret — PLACEHOLDER
#
# ⚠️  READ THIS BEFORE USING IT.
#
# 1. This file is a SHAPE, not a credential store. The values below are obvious dummies.
#    Do not commit real credentials to git. In a real cluster this object should come from
#    External Secrets Operator, Sealed Secrets, SOPS, or your cloud secret manager's CSI
#    driver — something that keeps the ciphertext, not the plaintext, in the repo.
#
# 2. IT IS NOT WIRED UP YET, AND WIRING IT UP NEEDS A JAVA CHANGE.
#    The app currently talks PLAINTEXT to the brokers. Spring's own producer/consumer would
#    pick up `spring.kafka.properties.*` / `spring.kafka.security.protocol` from the
#    environment, but the Kafka STREAMS client would not: KafkaStreamsConfig#kStreamsConfig
#    builds its property map from an empty `new HashMap<>()` and sets every entry by hand.
#    It never reads `spring.kafka.properties.*` or `spring.kafka.streams.properties.*`, so
#    any security setting injected here is silently ignored by the Streams client — which is
#    the client that matters.
#    See k8s/README.md → "Handed back to the application owners" for the exact change.
#
# 3. Until that change lands, keep this Secret referenced (the StatefulSet's envFrom marks it
#    optional) but populated only with the SASL placeholders. Adding real values now would
#    give a false impression that the traffic is authenticated.
# ---------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-streams-credentials
  namespace: kafka-analytics
  labels:
    app.kubernetes.io/name: ecommerce-streams
    app.kubernetes.io/component: streams-app
type: Opaque
stringData:
  # ── Broker authentication (inert until the Java change above lands) ──
  # SASL/SCRAM is assumed; swap for your cluster's mechanism.
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_USERNAME: "REPLACE_ME"
  KAFKA_SASL_PASSWORD: "REPLACE_ME"

  # Convenience form of the same thing, for whichever style the eventual config code uses.
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="REPLACE_ME" password="REPLACE_ME";

  # ── Schema Registry (declared for completeness; this app does not use SR today —
  #    ksqlDB does, and ksqlDB is not part of this StatefulSet) ──
  SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: "REPLACE_ME:REPLACE_ME"
