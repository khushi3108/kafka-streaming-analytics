# --- JVM ---------------------------------------------------------------------
# No machine-specific JDK path is pinned here: the Java toolchain is declared in
# build.gradle.kts so Gradle resolves (or provisions) a JDK 21 on any machine.
# If Gradle cannot find one, set JAVA_HOME to a JDK 21 installation.

# --- Build performance -------------------------------------------------------
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
