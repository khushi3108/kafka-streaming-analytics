# ---------------------------------------------------------------------
# Grafana dashboard provisioning — loads every JSON under /var/lib/grafana/dashboards
# (bind-mounted from monitoring/grafana/dashboards) at startup and on change.
# ---------------------------------------------------------------------
apiVersion: 1

providers:
  - name: "kafka-streaming"
    orgId: 1
    folder: "Kafka Streaming"
    type: file
    # false so an accidental edit in the UI cannot delete the file-provisioned dashboard.
    disableDeletion: true
    # Re-read every 30s, so editing the JSON on the host shows up without restarting Grafana.
    updateIntervalSeconds: 30
    # true = the UI "Save" button writes back into the JSON file. Left false: the file is the
    # source of truth and lives in git; UI edits are for experimenting, then porting by hand.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
