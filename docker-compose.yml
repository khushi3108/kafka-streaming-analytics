# =====================================================================
#  E-Commerce Kafka Streaming Stack
#  Boot order: zookeeper → kafka-1/kafka-2/kafka-3 → kafka-setup
#                                              → schema-registry
#                                              → ksqldb-server → ksqldb-cli
#                                              → kafka-ui
#
#  DURABILITY (why three brokers):
#    The Streams application runs EXACTLY_ONCE_V2 (see KafkaStreamsConfig.java). Exactly-once
#    is implemented with Kafka transactions, whose state lives in the internal
#    __transaction_state topic. On the previous single-broker setup that topic had
#    replication-factor 1, so losing the one broker lost the transaction log — the guarantee
#    would have been a demo, not a guarantee. Three brokers with RF=3 and
#    min.insync.replicas=2 means every committed transaction, offset and application record
#    survives the loss of any single broker, and writes are refused (rather than silently
#    under-replicated) if two are down.
#
#  MEMORY: sized for a 16 GB machine. Each broker is capped at 512 MB heap and ksqlDB at
#    768 MB, so the whole stack (3 brokers + ZK + SR + ksqlDB + UI) fits comfortably
#    alongside the Spring Boot app and an IDE. Do not remove KAFKA_HEAP_OPTS — the Confluent
#    image otherwise defaults to a 1 GB heap per broker.
#
#  PORTS: brokers are reachable from the host at localhost:9092, :9093, :9094 and from
#    inside the compose network at kafka-1:29092, kafka-2:29093, kafka-3:29094.
# =====================================================================

services:

  # ─── Zookeeper ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker 1 ───────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-1
    container_name: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-1:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      # ── Durability: replicate everything three ways, require 2 acks ──
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # __transaction_state backs EXACTLY_ONCE_V2. RF=3/minISR=2 so a broker loss cannot
      # take the transaction log — and with it the exactly-once guarantee — down with it.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 7 days (was 2 hours). Two hours makes replay and reprocessing impossible: any
      # investigation, backfill or "re-run the topology after a bug fix" needs the source
      # records to still exist. 168h is the Kafka default for a reason.
      KAFKA_LOG_RETENTION_HOURS: 168
      # true so ksqlDB can auto-create its own internal/output topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 15

  # ─── Kafka Broker 2 ───────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-2
    container_name: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka-2:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9093 --list
      interval: 10s
      timeout: 10s
      retries: 15

  # ─── Kafka Broker 3 ───────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-3
    container_name: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka-3:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9094 --list
      interval: 10s
      timeout: 10s
      retries: 15

  # ─── Topic bootstrap (one-shot: creates all application topics) ───
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-setup
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./docker/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: [ "/bin/bash", "/kafka-init.sh" ]
    restart: "no"

  # ─── Schema Registry ──────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # _schemas is Schema Registry's own source of truth — replicate it like everything else.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: curl -sf http://localhost:8081/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 8

  # ─── ksqlDB Server ────────────────────────────────────────────────
  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.5.0
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # ksqlDB creates command/internal/changelog topics of its own. They must be replicated
      # to RF=3 too, otherwise the broker-level min.insync.replicas=2 rejects writes to them.
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 3
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 3
      KSQL_KSQL_STREAMS_TOPIC_MIN_INSYNC_REPLICAS: 2
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 3
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      KSQL_HEAP_OPTS: "-Xms512m -Xmx768m"
    healthcheck:
      test: curl -sf http://localhost:8088/info || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── ksqlDB CLI (interactive) ─────────────────────────────────────
  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:7.5.0
    container_name: ksqldb-cli
    depends_on:
      ksqldb-server:
        condition: service_healthy
    entrypoint: /bin/sh
    tty: true

  # ─── ksqlDB Init (one-shot: creates all streams and tables) ───────
  # Pipes init.sql into the CLI so ksqlDB is fully ready after compose up
  ksqldb-setup:
    image: confluentinc/cp-ksqldb-cli:7.5.0
    container_name: ksqldb-setup
    depends_on:
      ksqldb-server:
        condition: service_healthy
    volumes:
      - ./ksql:/ksql:ro
      - ./docker:/docker:ro
    entrypoint: [ "/bin/bash", "/docker/ksql-init.sh" ]
    restart: "no"

  # ─── Kafka UI ─────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088
      JAVA_OPTS: "-Xms128m -Xmx384m"

  # ═══════════════════════════════════════════════════════════════════
  #  ADDED BY TASK A6 — application instances + observability.
  #
  #  Everything below is ADDITIVE. Nothing above this line was changed: the brokers,
  #  Zookeeper, Schema Registry, ksqlDB and Kafka UI are byte-for-byte as they were.
  #
  #  ── MEMORY BUDGET (16 GB machine) ────────────────────────────────
  #  Pre-existing:  zookeeper 256m heap (~0.4 GB RSS) + 3 x kafka 512m heap (~0.9 GB each,
  #                 2.7 GB) + schema-registry 512m (~0.7 GB) + ksqldb 768m (~1.0 GB) +
  #                 kafka-ui 384m (~0.6 GB)                                   ≈ 5.4 GB
  #  Added here:    app-1 1.0 GB + app-2 1.0 GB                               ≈ 2.0 GB
  #                 kafka-exporter 0.125 GB + prometheus 0.5 GB + grafana 0.375 GB ≈ 1.0 GB
  #                                                                    ─────────────────
  #                 TOTAL                                                     ≈ 8.4 GB
  #
  #  Every added service carries an explicit `mem_limit`, so the ceiling is enforced rather
  #  than hoped for. 8.4 GB fits a 16 GB machine — but note that on macOS and Windows this
  #  is bounded by the DOCKER DESKTOP VM's memory allocation, which commonly defaults to
  #  8 GB. If containers start getting OOM-killed, raise Docker Desktop's memory to 12 GB
  #  (Settings → Resources), or bring up the stack without the two app containers and run
  #  the app on the host with `./gradlew bootRun` as before.
  #
  #  ── WHY TWO APP INSTANCES ────────────────────────────────────────
  #  One instance owns all three `orders` partitions, so its state store holds all the data
  #  and every query looks complete — which is precisely what hid the silent-partial-results
  #  bug that commit 7a52ef7 fixed. Two instances split the partitions, which means the
  #  Interactive Query fan-out, the peer discovery and the `partial`/`failures` fields are
  #  actually EXERCISED by `docker compose up` rather than only in theory.
  #
  #  ── PORTS ADDED ──────────────────────────────────────────────────
  #    8090  app-1        8091  app-2        9308  kafka-exporter
  #    9091  Prometheus   (9090 is already taken by kafka-ui)
  #    3000  Grafana
  # ═══════════════════════════════════════════════════════════════════

  # ─── Streams app instance 1 ───────────────────────────────────────
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-kafka-streaming:local
    hostname: app-1
    container_name: app-1
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    ports:
      - "8090:8090"
    environment:
      # In-network broker addresses (:29092-4), not the host-facing :9092-4 listeners.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      SPRING_KAFKA_STREAMS_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      SERVER_PORT: 8090
      # The address the OTHER instance uses to reach this one. `app-1` is the compose
      # network alias, resolvable from app-2. NOT localhost — see the long note in
      # KafkaStreamsConfig.java: inside a container `localhost` is that container, so the
      # default would make each instance advertise itself as the other's loopback and the
      # fan-out would silently query itself.
      APP_STREAMS_APPLICATION_SERVER: app-1:8090
      APP_STREAMS_STATE_DIR: /var/lib/kafka-streams
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      LOGGING_LEVEL_COM_ECOMMERCE_STREAMING: INFO
    volumes:
      # Named volume, not a bind mount: RocksDB does a lot of small writes and fsyncs, and
      # bind-mounted host filesystems on macOS/Windows make that pathologically slow.
      # Persisting it also means `compose restart` replays the changelog delta instead of
      # rebuilding every store from the beginning of the topic.
      - app1-state:/var/lib/kafka-streams
    # Mirrors the Kubernetes container securityContext (readOnlyRootFilesystem: true) so a
    # missing writable path is caught locally rather than on first deploy.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      # Reads the BODY, not the status code. /api/analytics/streams/status answers 200 for
      # every stream state by design, so a plain HTTP check would call a REBALANCING instance
      # healthy. `queryable` is true only when KafkaStreams.State == RUNNING. Identical logic
      # to the Kubernetes readiness probe in k8s/30-statefulset.yaml.
      test: ["CMD-SHELL", "curl -sf --max-time 4 http://localhost:8090/api/analytics/streams/status | grep -q '\"queryable\":true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 1g
    restart: unless-stopped

  # ─── Streams app instance 2 ───────────────────────────────────────
  # Same application-id (so the two form ONE Streams application and split the partitions),
  # different port, different advertised address, different state volume.
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-kafka-streaming:local
    hostname: app-2
    container_name: app-2
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    ports:
      - "8091:8091"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      SPRING_KAFKA_STREAMS_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      SERVER_PORT: 8091
      APP_STREAMS_APPLICATION_SERVER: app-2:8091
      APP_STREAMS_STATE_DIR: /var/lib/kafka-streams
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      LOGGING_LEVEL_COM_ECOMMERCE_STREAMING: INFO
    volumes:
      - app2-state:/var/lib/kafka-streams
    read_only: true
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 4 http://localhost:8091/api/analytics/streams/status | grep -q '\"queryable\":true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 1g
    restart: unless-stopped

  # ─── Kafka exporter (broker + consumer-group metrics for Prometheus) ───
  # Chosen over the JMX exporter for one reason: CONSUMER GROUP LAG. Lag is the difference
  # between a group's committed offset and the partition's log end offset — it lives in the
  # broker's consumer-group protocol, not in a JMX MBean, so the JMX exporter cannot produce
  # it at all. For a streaming application lag is THE health metric, so the exporter that
  # reports it wins. (Add the JMX exporter alongside if you also want broker internals such
  # as request queue time.)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    hostname: kafka-exporter
    container_name: kafka-exporter
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka-1:29092
      - --kafka.server=kafka-2:29093
      - --kafka.server=kafka-3:29094
      # Per-partition lag, not just per-topic totals. Costs cardinality but exposes SKEW —
      # one hot partition among three is a third of the traffic and is invisible in a sum.
      - --topic.filter=.*
      - --group.filter=.*
      - --web.listen-address=:9308
    mem_limit: 128m
    restart: unless-stopped

  # ─── Prometheus ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    hostname: prometheus
    container_name: prometheus
    depends_on:
      - kafka-exporter
    ports:
      # 9091 on the host: 9090 is already published by kafka-ui. Inside the network
      # Prometheus still listens on the conventional 9090, which is what the Grafana
      # datasource in monitoring/grafana/provisioning points at.
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 24h, not the 15-day default: this is a laptop stack and the TSDB is the one component
      # here that grows without bound.
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    mem_limit: 512m
    restart: unless-stopped

  # ─── Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.4
    hostname: grafana
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # LOCAL DEVELOPMENT CREDENTIALS ONLY. This Grafana is bound to the loopback stack and
      # holds no data of its own. Do not copy this block to anything reachable from a network
      # you do not control.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewer access so the dashboard opens without a login prompt during a demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Land straight on the streaming dashboard instead of the empty Grafana home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka-streams-analytics.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped

# ═════════════════════════════════════════════════════════════════════
#  Named volumes (added by task A6).
#
#  app1-state / app2-state hold each instance's RocksDB tree. They are the compose analogue
#  of the StatefulSet's volumeClaimTemplates, and they exist for the same reason: without
#  them, every `compose down` throws away the materialised state and the next `up` replays
#  every changelog topic from the beginning before either instance can answer a query.
#
#  `docker compose down` KEEPS them. `docker compose down -v` deletes them and forces that
#  full restore — which is exactly how you test the restore path deliberately.
# ═════════════════════════════════════════════════════════════════════
volumes:
  app1-state:
  app2-state:
  prometheus-data:
  grafana-data:
